<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Form Hub</title>
  <meta name="description" content="Google Forms and Sheets responses in one place, with notifications.">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Form Hub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/inbox">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Form Hub</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/inbox" data-route="inbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l1.5 3h5L16 13h4M4 13l2.5-8h11L20 13v6H4z"/></svg>
        <span>Inbox</span><b class="badge" id="navBadge" hidden></b>
      </a>
      <a href="#/sources" data-route="sources">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span>Linked</span>
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span>Alerts &amp; settings</span>
      </a>
    </nav>
  </header>

  <div class="banner" id="banner" hidden></div>
  <main id="main" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="detail" aria-labelledby="detailTitle"></dialog>

  <script src="app.js"></script>
</body>
</html>
